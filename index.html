<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Βασίλειος Σαλάκος</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e1e2f, #3f3f5f);
      font-family: Arial, Helvetica, sans-serif;
      color: #e8e8f0;
    }
    .container {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .icon-link {
      width: 100px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.7rem;
      transition: transform 0.2s ease;
    }
    .icon-link:hover { transform: scale(1.1); }
    .icon-box {
      width: 80px;
      height: 80px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff14;
      box-shadow: 0 4px 8px rgba(0,0,0,0.25);
    }
    .icon-box svg {
      width: 40px;
      height: 40px;
      fill: none;
      stroke: #e8e8f0;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .label {
      font-size: 0.9rem;
      letter-spacing: 0.04em;
      opacity: 0.9;
    }
    @media (max-width: 520px) {
      .container { gap: 1.4rem; }
      .icon-link { width: 88px; }
    }
  </style>
</head>
