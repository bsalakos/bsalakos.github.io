<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <!-- Theme Loader JavaScript -->
  <script src="theme-loader.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Βασίλειος Σαλάκος — Portfolio</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Εδώ κρατάμε ΜΟΝΟ τα styles του Bento Grid και του Navigation Dock που είναι μοναδικά */
    .bento-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-auto-rows: 105px;
      gap: 16px;
      width: 700px;
      max-width: 1100px;
      padding: 2rem;
      margin: 0 auto;
    }

    .patch-card {
      background: var(--card-bg);
      border: 1px solid var(--theme-border);
      box-shadow: var(--card-shadow);
      border-radius: 20px;
      padding: 1.4rem;
      text-decoration: none;
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 1rem;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), 
                  background 0.3s ease, 
                  border-color 0.3s ease;
      will-change: transform;
      overflow: hidden;
      position: relative;
      cursor: pointer;
    }

    .patch-card:hover {
      transform: translateY(-4px) translateZ(0);
      background: var(--hover-bg);
    }

    .patch-icon svg {
      width: 36px;
      height: 36px;
      fill: none;
      stroke: var(--icon-color);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: block;
      flex-shrink: 0;
    }

    .patch-desc {
      position: absolute;
      bottom: 0.8rem;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    .patch-bio { grid-column: 1 / 3; grid-row: 1 / span 2; }
    .patch-about { grid-column: 3; grid-row: 1 / span 2; }
    .patch-projects { grid-column: 1; grid-row: 3 / span 2; }
    .patch-hobbies { grid-column: 2 / 4; grid-row: 3; }
    .patch-blog { grid-column: 2; grid-row: 4; }
    .patch-linkedin { grid-column: 3; grid-row: 4; }

    @media (min-width: 601px) {
      #card-about, #card-linkedin { align-items: flex-end !important; }
      #card-hobbies { align-items: center !important; }
      #card-hobbies .patch-icon { transform: translateY(-6px); }
      #card-about .patch-icon { transform: translateX(7px) translateY(-7px); }
      #card-linkedin .patch-icon { transform: translateX(3px) translateY(-4px); }
      #card-bio .patch-icon { transform: translateX(-8px) translateY(-5px); }
      #card-projects .patch-icon { transform: translateX(-5px) translateY(-5px); }
      #card-blog .patch-icon { transform: translateX(-4px) translateY(-8px); }
    }

    @media (max-width: 600px) {
      .bento-container {
        grid-template-columns: repeat(3, 1fr);
        grid-auto-rows: 105px;
        gap: 8px;
        width: 290px;
        padding: 0.5rem;
      }
      .bento-container .patch-card {
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.5rem;
      }
      .bento-container .patch-desc {
        position: static;
        text-align: center;
      }
    }

    /* Floating Navigation Dock (για το Alternative View) */
    body:not(.home-layout) .nav-dock,
    body.is-home-section .nav-dock {
      display: none !important;
    }

    .nav-dock {
      position: fixed;
      right: 2rem;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      z-index: 100;
    }

    .dock-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--theme-border);
      color: var(--text-color);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(8px);
      box-shadow: var(--card-shadow);
    }

    .dock-btn svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .dock-btn:hover {
      background: var(--hover-bg);
      transform: scale(1.08);
    }

    .dock-btn.active {
      background: #8b5cf6;
      border-color: #a78bfa;
      color: #ffffff;
      box-shadow: 0 0 15px rgba(139, 92, 246, 0.5);
    }
    .dock-btn.active svg {
      stroke: #ffffff;
    }

    .page-section {
      display: none;
      animation: fadeIn 0.4s ease-in-out;
    }

    .page-section.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .content-card {
      background: var(--card-bg);
      border: 1px solid var(--theme-border);
      box-shadow: var(--card-shadow);
      border-radius: 20px;
      padding: 2.5rem;
      color: var(--text-color);
      max-width: 800px;
      margin: 0 auto;
    }

    @media (max-width: 600px) {
      .nav-dock {
        top: auto;
        bottom: 1rem;
        right: 50%;
        transform: translateX(50%);
        flex-direction: row;
      }
    }
  </style>
</head>

<body class="home-layout is-home-section">
