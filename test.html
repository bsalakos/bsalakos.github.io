<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Μουσική — Βασίλειος Σαλάκος</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(135deg, #1e1e2f, #3f3f5f);
      background-attachment: fixed;
      font-family: Arial, Helvetica, sans-serif;
      color: #e8e8f0;
      padding: 3rem 1rem;
    }

    .music-container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* Top Navigation Header */
    .music-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding-bottom: 1.2rem;
    }

    .music-title {
      height: 38px;
      padding: 0 0.85rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: #ffffff14;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
      margin-bottom: -0.2rem;
    }

    .music-title h1 {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 500;
      line-height: 1;
      color: #e8e8f0;
    }

    .music-title .title-icon {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: #e8e8f0;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: block;
      flex-shrink: 0;
    }

    .nav-dropdown-wrapper {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      position: relative;
      margin-bottom: -0.2rem;
    }

    .home-link {
      height: 38px;
      padding: 0 0.75rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      color: #e8e8f0;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      line-height: 1;
      opacity: 0.9;
      background: #ffffff14;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .home-link svg {
      display: block;
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .home-link:hover {
      opacity: 1;
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateX(-3px);
    }

    /* Spotify Player Container */
    .spotify-card {
      background: #ffffff14;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.25);
      border-radius: 16px;
      padding: 0.8rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .spotify-card iframe {
      border-radius: 12px;
      width: 100%;
      height: 152px;
      border: 0;
    }
  </style>
</head>
<body>

  <div class="music-container">
<iframe width="560" height="315" src="https://www.youtube.com/embed/YvZHfD_uzCg?si=d5Cheu2BiDdhXsaM" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</div>
</body>
</html>
