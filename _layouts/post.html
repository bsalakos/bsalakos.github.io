<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} — Βασίλειος Σαλάκος</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(135deg, #1e1e2f, #3f3f5f);
      font-family: Arial, Helvetica, sans-serif;
      color: #e8e8f0;
      padding: 3rem 1rem;
    }
    .article-container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: #e8e8f0;
      text-decoration: none;
      font-size: 0.9rem;
      opacity: 0.8;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .back-link:hover {
      opacity: 1;
      transform: translateX(-3px);
    }
    .back-link svg {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .post-meta {
      font-size: 0.85rem;
      opacity: 0.6;
      letter-spacing: 0.03em;
    }
    h1 {
      margin: 0;
      font-size: 1.8rem;
      font-weight: 500;
      line-height: 1.3;
    }
    .post-content {
      line-height: 1.7;
      font-size: 1rem;
      opacity: 0.9;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      padding-top: 1.5rem;
    }
    .post-content p {
      margin-top: 0;
      margin-bottom: 1.2rem;
    }
  </style>
</head>
<body>

  <article class="article-container">
    <a class="back-link" href="/blog.html">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Πίσω στο Blog
    </a>
    <span class="post-meta">{{ page.date | date: "%d/%m/%Y" }}</span>
    <h1>{{ page.title }}</h1>
    <div class="post-content">
      {{ content }}
    </div>
  </article>

</body>
</html>
